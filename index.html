<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentasi | INDC PROJECT</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Highlight.js & Supabase -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: { 'neo': '4px 4px 0px 0px rgba(0,0,0,1)', 'neo-sm': '2px 2px 0px 0px rgba(0,0,0,1)' },
                    colors: { 'neo-bg': '#F4F4F0', 'neo-yellow': '#FFD54F', 'neo-pink': '#FF80AB', 'neo-green': '#A5D6A7', 'neo-blue': '#81D4FA' }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F4F4F0; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #FFD54F; border: 2px solid #000; }
        pre code.hljs { padding: 1.5rem; font-size: 0.875rem; border-radius: 0; }
    </style>
</head>
<body class="bg-neo-bg text-black font-sans antialiased">

    <!-- Toast Notifikasi -->
    <div id="toastContainer" class="fixed top-4 left-0 right-0 z-[100] flex flex-col items-center space-y-2 pointer-events-none px-4"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white border-b-4 border-black p-4 shadow-neo flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="md:hidden bg-neo-yellow border-2 border-black p-1 shadow-neo-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="bg-black text-white px-3 py-1 border-2 border-black shadow-neo-sm font-black text-xl tracking-widest uppercase">INDC DOCS</div>
        </div>
        <button onclick="loginAdmin()" class="text-xl bg-neo-bg border-2 border-black p-1 shadow-neo-sm hover:bg-neo-yellow transition" title="Login Admin">🔒</button>
    </nav>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:sticky top-[76px] left-0 h-[calc(100vh-76px)] w-64 bg-white border-r-4 border-black p-5 overflow-y-auto transform -translate-x-full md:translate-x-0 transition-transform z-40 flex flex-col">
            <h3 class="font-black text-xs uppercase text-gray-500 mb-3 tracking-widest">Folder Proyek</h3>
            
            <ul id="folderList" class="space-y-2 flex-1">
                <li class="text-xs font-black animate-pulse">Memuat database...</li>
            </ul>

            <!-- Tombol Tambah Folder (Hanya Admin) -->
            <div id="adminSidebarPanel" class="hidden mt-6 pt-4 border-t-4 border-black">
                <button onclick="buatFolderBaru()" class="w-full bg-neo-yellow text-black font-black text-sm uppercase px-3 py-2 border-2 border-black shadow-neo-sm hover:translate-x-[2px] hover:translate-y-[2px] transition">➕ Buat Folder</button>
            </div>
        </aside>

        <!-- Overlay Mobile -->
        <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

        <!-- Konten Utama -->
        <main class="flex-1 p-6 lg:p-10 max-w-4xl w-full">
            
            <div id="welcomeScreen" class="block space-y-6">
                <div class="bg-neo-blue border-4 border-black p-6 shadow-neo text-center">
                    <h1 class="text-3xl font-black uppercase mb-2">Pilih Proyek</h1>
                    <p class="font-bold text-sm">Silakan pilih folder proyek di menu sebelah kiri untuk melihat atau mengelola dokumentasi skrip.</p>
                </div>
            </div>

            <div id="docScreen" class="hidden space-y-6">
                <div class="bg-white border-4 border-black p-5 shadow-neo flex justify-between items-center">
                    <h1 id="docTitle" class="text-2xl font-black uppercase bg-neo-yellow px-2 border-2 border-black shadow-neo-sm">Nama Proyek</h1>
                    <button id="btnHapusFolder" onclick="hapusFolder()" class="hidden bg-red-500 text-white font-black text-[10px] px-2 py-1 border-2 border-black shadow-neo-sm uppercase">Hapus Folder</button>
                </div>
                
                <!-- Area Render Skrip & File -->
                <div id="docContentList" class="space-y-6"></div>

                <!-- Form Upload & Input Skrip (Hanya Admin) -->
                <div id="adminFormPanel" class="hidden mt-10 bg-white border-4 border-black p-5 shadow-neo">
                    <h2 class="font-black text-sm uppercase mb-4 bg-neo-green inline-block px-2 border-2 border-black shadow-neo-sm">Area Developer (Admin)</h2>
                    
                    <div class="flex space-x-2 mb-4 bg-neo-bg border-2 border-black p-1 shadow-neo-sm">
                        <button onclick="switchTab('teks')" id="tabTeks" class="flex-1 font-black text-[10px] uppercase py-2 bg-black text-white border-2 border-black">PASTE SKRIP</button>
                        <button onclick="switchTab('file')" id="tabFile" class="flex-1 font-black text-[10px] uppercase py-2 bg-white text-black border-2 border-black">UPLOAD FILE</button>
                    </div>

                    <div id="formTeks" class="space-y-3">
                        <input type="text" id="inputJudul" placeholder="Judul Skrip (misal: bot.js)" class="w-full border-2 border-black p-2 font-black text-xs outline-none shadow-neo-sm">
                        <textarea id="inputKode" rows="6" placeholder="// Paste kode skrip Anda di sini..." class="w-full bg-slate-900 text-green-400 border-4 border-black p-3 font-mono text-xs outline-none shadow-neo-sm"></textarea>
                        <button onclick="simpanSkrip()" class="w-full bg-neo-pink text-black font-black py-3 border-2 border-black shadow-neo hover:translate-x-[2px] hover:translate-y-[2px] transition uppercase text-xs">Simpan Skrip</button>
                    </div>

                    <div id="formFile" class="hidden space-y-3">
                        <div class="border-4 border-black border-dashed p-8 text-center cursor-pointer bg-neo-bg hover:bg-white transition" onclick="document.getElementById('inputFile').click()">
                            <span class="font-black text-black uppercase bg-neo-blue border-2 border-black px-4 py-2 shadow-neo-sm">PILIH FILE</span>
                            <input type="file" id="inputFile" class="hidden">
                            <p id="fileTerpilih" class="mt-4 text-xs font-black"></p>
                        </div>
                        <button onclick="uploadFile()" class="w-full bg-black text-white font-black py-3 border-2 border-black shadow-neo hover:translate-x-[2px] hover:translate-y-[2px] transition uppercase text-xs">Upload ke Server</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // --- KONFIGURASI SUPABASE ---
        const supabaseUrl = 'https://cnzxwpouuqbqbmcjfbey.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuenh3cG91dXFicWJtY2pmYmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTE3MTksImV4cCI6MjA5NTk4NzcxOX0.Su1nECD2OgNWAKAYmCydc1GBC7NBGvSh30IBvIXNOeM';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let isAdmin = false;
        let currentFolderId = null;

        // --- SISTEM NOTIFIKASI ---
        function showToast(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colors = isSuccess ? 'bg-neo-green text-black' : 'bg-neo-pink text-black';
            toast.className = `flex items-center px-4 py-3 border-4 border-black shadow-neo text-xs font-black uppercase pointer-events-auto transition-all transform translate-y-0 opacity-100 ${colors}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // --- UI TOGGLES ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function switchTab(mode) {
            const isTeks = mode === 'teks';
            document.getElementById('formTeks').classList.toggle('hidden', !isTeks);
            document.getElementById('formFile').classList.toggle('hidden', isTeks);
            document.getElementById('tabTeks').className = isTeks ? "flex-1 font-black text-[10px] uppercase py-2 bg-black text-white border-2 border-black" : "flex-1 font-black text-[10px] uppercase py-2 bg-white text-black border-2 border-black";
            document.getElementById('tabFile').className = isTeks ? "flex-1 font-black text-[10px] uppercase py-2 bg-white text-black border-2 border-black" : "flex-1 font-black text-[10px] uppercase py-2 bg-black text-white border-2 border-black";
        }

        document.getElementById('inputFile').addEventListener('change', function(e) {
            if(this.files.length > 0) document.getElementById('fileTerpilih').innerText = `File: ${this.files[0].name}`;
        });

        // --- SISTEM LOGIN ADMIN (PIN: sudi123) ---
        function loginAdmin() {
            if(isAdmin) {
                isAdmin = false;
                showToast("Logout dari Mode Admin", false);
            } else {
                const pin = prompt("Masukkan Password Developer:");
                // Password di set ke: sudi123
                if(pin === "sudi123") {
                    isAdmin = true;
                    showToast("Mode Admin Terbuka!", true);
                } else {
                    showToast("Password Salah!", false);
                }
            }
            renderAdminTools();
        }

        function renderAdminTools() {
            document.getElementById('adminSidebarPanel').classList.toggle('hidden', !isAdmin);
            document.getElementById('btnHapusFolder').classList.toggle('hidden', !isAdmin);
            if(currentFolderId) document.getElementById('adminFormPanel').classList.toggle('hidden', !isAdmin);
            // Render ulang dokumen untuk memunculkan tombol hapus file
            if(currentFolderId) muatIsiDokumen(currentFolderId, document.getElementById('docTitle').innerText);
        }

        // --- DATABASE: FOLDER PROYEK ---
        async function muatFolder() {
            const list = document.getElementById('folderList');
            const { data, error } = await supabase.from('projects').select('*').order('created_at', { ascending: true });
            
            if(error) { list.innerHTML = '<li class="text-red-500 font-black text-xs">Gagal memuat DB</li>'; return; }
            list.innerHTML = '';
            if(data.length === 0) list.innerHTML = '<li class="text-gray-500 font-black text-[10px] uppercase">Belum ada folder</li>';
            
            data.forEach(proj => {
                list.innerHTML += `
                    <li>
                        <button onclick="muatIsiDokumen('${proj.id}', '${proj.name}')" class="w-full text-left font-black text-sm uppercase px-3 py-2 border-2 border-transparent hover:border-black hover:bg-neo-yellow transition nav-btn break-words">
                            📁 ${proj.name}
                        </button>
                    </li>
                `;
            });
        }

        async function buatFolderBaru() {
            const nama = prompt("Nama Folder Baru:");
            if(!nama) return;
            const {error} = await supabase.from('projects').insert([{name: nama}]);
            if(error) showToast("Gagal buat folder", false);
            else { showToast("Folder dibuat!", true); muatFolder(); }
        }

        async function hapusFolder() {
            if(!confirm("Hapus folder ini beserta isinya secara permanen?")) return;
            await supabase.from('projects').delete().eq('id', currentFolderId);
            showToast("Folder terhapus!", true);
            document.getElementById('docScreen').classList.add('hidden');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            muatFolder();
        }

        // --- DATABASE: ISI DOKUMEN (TEKS & FILE) ---
        async function muatIsiDokumen(id, nama) {
            currentFolderId = id;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('docScreen').classList.remove('hidden');
            document.getElementById('docTitle').innerText = nama;
            document.getElementById('adminFormPanel').classList.toggle('hidden', !isAdmin);
            
            if(window.innerWidth < 768) toggleSidebar(); // Tutup sidebar di HP

            const container = document.getElementById('docContentList');
            container.innerHTML = '<p class="text-xs font-black animate-pulse">Mengambil data dari server...</p>';

            const { data, error } = await supabase.from('documentations').select('*').eq('project_id', id).order('created_at', { ascending: true });
            
            if(error) { container.innerHTML = '<p class="text-red-500 font-black text-xs">Gagal memuat dokumen.</p>'; return; }
            container.innerHTML = '';
            
            if(data.length === 0) { container.innerHTML = '<p class="text-gray-500 font-black text-[10px] uppercase border-4 border-black border-dashed p-4 text-center">Folder ini masih kosong</p>'; }

            data.forEach(doc => {
                const isFile = !!doc.file_url;
                const btnHapus = isAdmin ? `<button onclick="hapusDokumen('${doc.id}')" class="bg-red-500 text-white border-2 border-black font-black text-[10px] px-2 py-1 uppercase shadow-neo-sm hover:translate-y-[1px] hover:translate-x-[1px] mt-2">Hapus Item Ini</button>` : '';

                if(isFile) {
                    container.innerHTML += `
                    <div class="bg-white border-4 border-black p-5 shadow-neo">
                        <div class="flex justify-between items-center border-b-4 border-black pb-2 mb-3">
                            <h3 class="font-black text-sm uppercase">📄 ${doc.title}</h3>
                            <a href="${doc.file_url}" target="_blank" class="bg-black text-white px-3 py-1 font-black text-[10px] uppercase border-2 border-transparent shadow-neo-sm hover:translate-x-[1px] hover:translate-y-[1px]">DOWNLOAD</a>
                        </div>
                        ${btnHapus}
                    </div>`;
                } else {
                    const safeKode = doc.content_text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    container.innerHTML += `
                    <div class="bg-white border-4 border-black p-5 shadow-neo">
                        <h3 class="font-black text-sm uppercase mb-3 bg-neo-blue inline-block px-2 border-2 border-black shadow-neo-sm">📝 ${doc.title}</h3>
                        <div class="relative group border-4 border-black shadow-neo">
                            <div class="absolute top-0 right-0 p-2 z-10">
                                <button onclick="copyCodeText(this)" class="bg-neo-yellow text-black border-2 border-black font-black text-[10px] px-3 py-1 uppercase shadow-neo-sm hover:translate-x-[1px] hover:translate-y-[1px]">Copy</button>
                            </div>
                            <pre><code class="language-javascript">${safeKode}</code></pre>
                        </div>
                        ${btnHapus}
                    </div>`;
                }
            });
            hljs.highlightAll(); // Render warna kode
        }

        async function simpanSkrip() {
            const judul = document.getElementById('inputJudul').value;
            const kode = document.getElementById('inputKode').value;
            if(!judul || !kode) return showToast("Judul & kode wajib diisi!", false);
            
            document.getElementById('inputJudul').value = 'Menyimpan...';
            const {error} = await supabase.from('documentations').insert([{project_id: currentFolderId, title: judul, content_text: kode}]);
            
            if(error) showToast("Gagal menyimpan", false);
            else {
                showToast("Skrip tersimpan!", true);
                document.getElementById('inputJudul').value = '';
                document.getElementById('inputKode').value = '';
                muatIsiDokumen(currentFolderId, document.getElementById('docTitle').innerText);
            }
        }

        async function uploadFile() {
            const input = document.getElementById('inputFile');
            const file = input.files[0];
            if(!file) return showToast("Pilih file dulu!", false);
            
            showToast("Mengupload... Mohon tunggu");
            const namaFile = `${Date.now()}_${file.name}`;
            const path = `${currentFolderId}/${namaFile}`;

            // 1. Upload ke Storage
            const { error: uploadError } = await supabase.storage.from('script-files').upload(path, file);
            if(uploadError) return showToast("Gagal upload file!", false);

            // 2. Ambil URL Publik
            const { data: urlData } = supabase.storage.from('script-files').getPublicUrl(path);

            // 3. Simpan ke Database
            const { error: dbError } = await supabase.from('documentations').insert([{project_id: currentFolderId, title: file.name, file_url: urlData.publicUrl}]);
            
            if(dbError) showToast("Gagal menyimpan data file", false);
            else {
                showToast("File berhasil diupload!", true);
                input.value = '';
                document.getElementById('fileTerpilih').innerText = '';
                muatIsiDokumen(currentFolderId, document.getElementById('docTitle').innerText);
            }
        }

        async function hapusDokumen(docId) {
            if(!confirm("Yakin ingin menghapus item ini?")) return;
            await supabase.from('documentations').delete().eq('id', docId);
            showToast("Item dihapus!", true);
            muatIsiDokumen(currentFolderId, document.getElementById('docTitle').innerText);
        }

        function copyCodeText(button) {
            const codeBlock = button.parentElement.nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                const ori = button.innerText;
                button.innerText = 'COPIED!';
                setTimeout(() => { button.innerText = ori; }, 2000);
            });
        }

        // Panggil saat web pertama dimuat
        document.addEventListener("DOMContentLoaded", () => {
            muatFolder();
        });
    </script>
</body>
</html>
